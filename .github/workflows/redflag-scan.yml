name: redflag-scan

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Make tools executable
        run: |
          chmod +x tools/*.sh || true

      - name: Scan repository files for red flags
        run: |
          found=0
          while IFS= read -r f; do
            if ./tools/redflag-scan.sh --fail "$f" >/dev/null 2>&1; then
              :
            else
              code=$?
              if [ "$code" -eq 2 ]; then
                echo "[match] $f"
                ./tools/redflag-scan.sh "$f" || true
                found=1
              else
                echo "[warn] scanner error on $f"
                found=1
              fi
            fi
          done < <(
            git ls-files \
              | grep -E '\.(md|txt|sh|yml|yaml|json)$' \
              | grep -vE '^examples/fixtures/' \
              | grep -vE '^tools/patterns/' \
              | grep -vE '^tools/run-checks\.sh$'
          )

          if [ "$found" -eq 1 ]; then
            echo "Red flags detected. Please sanitize/redact before merging."
            exit 1
          fi
